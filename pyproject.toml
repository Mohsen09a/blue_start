[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-start-research"
version = "0.1.0"
description = "Scalable analysis of the pairwise and higher-order Bluesky networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
]

[project.optional-dependencies]
analysis = [
    "numpy>=2",
    "scipy>=1.14",
    "numba>=0.61",
    "pyarrow>=18",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
graphs = [
    "igraph>=0.11",
    "leidenalg>=0.10",
    "xgi>=0.9",
]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[project.scripts]
blue-start = "blue_start.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "new_research"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
